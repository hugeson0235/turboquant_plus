name: ctq
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.11
  - pytorch=2.5.1
  - pytorch-cuda=12.1
  - numpy=2.0
  - scipy=1.15
  - pip
  - pip:
      - -e .[dev]
      - accelerate>=1.1,<2
      - datasets==3.1.0
      - scikit-learn==1.5.2
      - sentencepiece
      - transformers==4.45.2
